label: "01 // HAKKIMDA"
heading: "İnşaat ve yazılım dünyasını birleştiriyorum"

paragraphs:
  - 'Elimde hem bir metre hem bir klavye olacağını hiç düşünmemiştim. <strong class="text-ink">Ankara</strong> merkezli büyük ölçekli inşaat projelerinde BIM Uzmanı ve Şantiye Yöneticisi olarak Revit MEP koordinasyonu yürütüyorum; bunun yanında web siteleri tasarlıyor, SwiftUI ile App Store''da yayınlanan iOS uygulamaları geliştiriyorum.'
  - 'İki dünya birbirinden besleniyor: şantiyenin sistemli, süreç odaklı disiplini yazılım mimarisine sızıyor; kodun hızlı deneme-yanılma alışkanlığı da BIM''deki dijital dönüşüm çalışmalarına yön veriyor.'
  - 'Hangi tarafımla ilgileniyorsan, ona özel siteme göz atabilirsin — detaylı proje ve deneyimler orada, aşağıdan üçüne de ulaşabilirsin.'

