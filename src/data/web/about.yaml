label: "01 // HAKKIMDA"
heading: "Astro ve Tailwind ile modern web siteleri geliştiriyorum"

paragraphs:
  - 'Web Sitesi Geliştirici olarak <strong class="text-ink">Ankara</strong> merkezli çalışıyorum. Küçük işletmeler ve girişimciler için Astro, Tailwind CSS ve TypeScript kullanarak hızlı, modern ve SEO uyumlu web siteleri tasarlıyor ve geliştiriyorum.'
  - 'İnşaat sektöründeki BIM koordinasyon deneyimim bana süreç odaklı, detaycı bir çalışma disiplini kazandırdı — bunu web projelerinde temiz kod mimarisi ve zamanında teslimat olarak uyguluyorum.'
  - 'Bugüne kadar mekanik tesisat ve inşaat sektöründen firmalar için kurumsal web siteleri geliştirdim: <strong class="text-ink">3E Mühendislik</strong>, <strong class="text-ink">AD Mekanik</strong>, <strong class="text-ink">ÇF İnşaat</strong> ve <strong class="text-ink">Dutes Yapı</strong>.'
  - 'Web geliştirme çalışmalarımı ve deneyimlerimi ayrıca <a href="/blog" class="font-medium">blogumda</a> paylaşıyorum.'

